<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#646cff"/>
  
  <!-- Car icon -->
  <g transform="translate(256, 256)">
    <!-- Car body -->
    <rect x="-120" y="-40" width="240" height="80" rx="20" fill="white"/>
    <!-- Windshield -->
    <rect x="-100" y="-30" width="60" height="60" rx="5" fill="#242424" opacity="0.3"/>
    <rect x="40" y="-30" width="60" height="60" rx="5" fill="#242424" opacity="0.3"/>
    <!-- Wheels -->
    <circle cx="-80" cy="50" r="25" fill="#242424"/>
    <circle cx="80" cy="50" r="25" fill="#242424"/>
    <circle cx="-80" cy="50" r="15" fill="white"/>
    <circle cx="80" cy="50" r="15" fill="white"/>
  </g>
  
  <!-- App title text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">RideMatch</text>
</svg>

